<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Registration - SIS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">STUDENT INFORMATION SYSTEM</div>
  <nav class="mainnav">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="registration.html" class="active">Student Registration</a></li>
      <li><a href="records.html">Student Records</a></li>
    </ul>
  </nav>
</header>

<main>
  <h2 class="section-title">Student Registration Form</h2>

  <!-- Sample state messages (static design preview) -->
  <div class="message-box error">
    ⚠ Please fill in all required fields before submitting.
  </div>

  <form class="card-form">
    <div class="form-row">
      <div class="field">
        <label for="studentId">Student ID <span class="required">*</span></label>
        <input type="text" id="studentId" name="studentId" placeholder="e.g. 2026-0001" required>
      </div>
      <div class="field">
        <label for="firstName">First Name <span class="required">*</span></label>
        <input type="text" id="firstName" name="firstName" placeholder="Juan" required>
      </div>
    </div>

    <div class="form-row">
      <div class="field">
        <label for="lastName">Last Name <span class="required">*</span></label>
        <input type="text" id="lastName" name="lastName" placeholder="Dela Cruz" required>
      </div>
      <div class="field">
        <label for="email">Email <span class="required">*</span></label>
        <input type="email" id="email" name="email" placeholder="juan@email.com" required>
      </div>
    </div>

    <div class="form-row">
      <div class="field">
        <label for="contact">Contact Number <span class="required">*</span></label>
        <input type="tel" id="contact" name="contact" placeholder="09XX-XXX-XXXX" required>
      </div>
      <div class="field">
        <label for="course">Course/Program <span class="required">*</span></label>
        <input type="text" id="course" name="course" placeholder="BS Information Technology" required>
      </div>
    </div>

    <div class="form-row">
      <div class="field">
        <label for="yearLevel">Year Level <span class="required">*</span></label>
        <select id="yearLevel" name="yearLevel" required>
          <option value="">Select year level</option>
          <option>1st Year</option>
          <option>2nd Year</option>
          <option>3rd Year</option>
          <option>4th Year</option>
        </select>
      </div>
      <div class="field">
        <label for="gender">Gender <span class="required">*</span></label>
        <select id="gender" name="gender" required>
          <option value="">Select gender</option>
          <option>Male</option>
          <option>Female</option>
          <option>Prefer not to say</option>
        </select>
      </div>
    </div>

    <small class="hint">Fields marked with * are required.</small>

    <div class="form-actions">
      <button type="submit" class="btn">Register Student</button>
      <button type="reset" class="btn outline">Clear Form</button>
    </div>
  </form>
</main>

<footer class="sitefoot">
  &copy; 2026 <span>Student Information System</span>. All rights reserved.
</footer>

</body>
</html>
